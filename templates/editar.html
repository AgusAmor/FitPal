<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
</head>

<body>
    <header
    class="bg-dark text-white p-3"
    style="font-family: 'Roboto', sans-serif"
  >
    <div class="container d-flex justify-content-between align-items-center">
      <img
        src="{{ url_for('static', filename='img/logo.png') }}"
        class="logo"
        alt="Logo"
      />
    </div>
  </header>
    <div class="container d-flex align-items-center justify-content-center vh-100">
        <div class="bg-light p-5 rounded" style="width: 400px;">
            <h2 class="mb-4 text-center">Editar Datos</h2>
            <form method="POST" action="{{ url_for('actualizar_usuario', usuario_id=usuario.id) }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Nombre de Usuario</label>
                    <input type="text" class="form-control" id="username" name="username" value="{{ usuario.username }}" required>
                </div>
                <div class="mb-3">
                    <label for="dni" class="form-label">DNI</label>
                    <input type="text" class="form-control" id="dni" name="dni" value="{{ usuario.dni }}" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ usuario.email }}" required>
                </div>
                <div class="mb-3">
                    <label for="is_admin" class="form-label">Rol</label>
                    <select class="form-select" id="is_admin" name="is_admin" required>
                        <option value="0" {% if usuario.is_admin == 0 %}selected{% endif %}>Usuario</option>
                        <option value="1" {% if usuario.is_admin == 1 %}selected{% endif %}>Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success btn-lg w-100">Guardar Cambios</button>
            </form>
            <a href="{{ url_for('usuarios') }}" class="btn btn-link mt-3 w-100">Volver</a>
        </div>
    </div>
</body>
</html>
