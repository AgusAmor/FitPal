<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Membresía</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script>
      function setMembershipDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const membershipType = urlParams.get("tipo");
        const membershipDetails = {
          basico: {
            name: "Membresía Básico",
            price: "$30.000 /mes",
          },
          medio: {
            name: "Membresía Medio",
            price: "$50.000 /mes",
          },
          premium: {
            name: "Membresía Premium",
            price: "$80.000 /mes",
          },
        };

        if (membershipDetails[membershipType]) {
          document.getElementById("membershipName").textContent =
            membershipDetails[membershipType].name;
          document.getElementById("membershipPrice").textContent =
            membershipDetails[membershipType].price;
        } else {
          document.getElementById("membershipName").textContent =
            "Membresía Desconocida";
          document.getElementById("membershipPrice").textContent = "";
        }
      }

      function confirmMembership(event) {
        event.preventDefault();
        alert(
          "¡Gracias por elegirnos! Próximamente tendrás acceso a la membresía seleccionada."
        );
        
        window.location.href = "/home";
      }
    </script>
</head>
<body onload="setMembershipDetails()">
    <div class="container my-5">
        <h2 class="text-center mb-4" id="membershipName">Membresía</h2>
        <p class="text-center" id="membershipPrice"></p>
        <form class="mx-auto" style="max-width: 400px;" onsubmit="confirmMembership(event)">
            <div class="mb-3">
                <label for="name" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="name" placeholder="Ingresa tu nombre" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo" required>
            </div>
            <div class="mb-3">
                <label for="cardNumber" class="form-label">Número de tarjeta</label>
                <input type="text" class="form-control" id="cardNumber" placeholder="1234 5678 9101 1121" required>
            </div>
            <div class="row">
                <div class="col">
                    <label for="expiry" class="form-label">Fecha de expiración</label>
                    <input type="text" class="form-control" id="expiry" placeholder="MM/AA" required>
                </div>
                <div class="col">
                    <label for="cvv" class="form-label">CVV</label>
                    <input type="text" class="form-control" id="cvv" placeholder="123" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-4">Pagar</button>
        </form>
    </div>
</body>
</html>
